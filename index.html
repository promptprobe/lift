<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lift</title>
  <meta name="description" content="lift" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    /*
     * Palette from Financial Times Origami o-colors (core brand),
     * @financial-times/o-colors v6.7.0 src/scss/_palette.scss
     * https://github.com/Financial-Times/origami/blob/main/components/o-colors/src/scss/_palette.scss
     *
     * Tokens used (oColorsByName):
     *   paper     #FFF1E5  page background  (Origami page-background)
     *   wheat     #F2DFCE  field / result well
     *   black     #000000  ink
     *   white     #FFFFFF  input fill
     *   claret    #990F3D  primary action + peeking warning
     *   claret-50 #800D33  primary hover (o-colors claret tone 50)
     *   teal      #0D7680  duration / ok
     *   oxford    #0F5499  links
     *   jade      #00994D  success flash
     *   crimson   #CC0000  hard error
     *
     * Mixes (o-colors default palette mixes of black over paper):
     *   black-60  #66605C  mute ink — 60% black / 40% paper
     *   line      #D8CDC2  15% black over paper
     *             (between published black-10 #E6D9CE and black-20 #CCC1B7)
     *
     * Origami ft-pink is #FCD0B1 (logo). Page UI uses paper, not ft-pink.
     *
     * Type ramp (px):
     *   wordmark h1     42  Source Serif 4  400
     *   section labels  11  Noto Sans KR    500  tracking 0.12em  ink
     *   field labels    13  Noto Sans KR    500  ink
     *   result .v       38  Source Serif 4  600  tabular-nums
     *   buttons         13  Noto Sans KR    500
     *   footer          12  Noto Sans KR    400  mute
     *   body / UI       15  Noto Sans KR    400  ink
     */
    :root {
      color-scheme: light;
      --paper: #FFF1E5;
      --wheat: #F2DFCE;
      --black: #000000;
      --white: #FFFFFF;
      --claret: #990F3D;
      --claret-50: #800D33;
      --teal: #0D7680;
      --oxford: #0F5499;
      --jade: #00994D;
      --crimson: #CC0000;
      --ink: var(--black);
      --mute: #66605C;
      --line: #D8CDC2;
      --serif: "Source Serif 4", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --r: 0px;
      --r-field: 2px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font: 15px/1.5 var(--sans);
      color: var(--ink);
      background: var(--paper);
      padding: 0;
      border-top: 3px solid var(--black);
    }
    .studio {
      width: 100%;
      padding: 20px 28px 56px;
    }
    header {
      text-align: left;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0 0 8px;
    }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
    .chip, .seg button, .kseg button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: var(--wheat);
      color: var(--ink);
      border-radius: 0;
      padding: 6px 10px;
      font: 13px/1.2 var(--sans);
      font-weight: 500;
      cursor: pointer;
    }
    .chip:hover, .seg button:hover, .kseg button:hover {
      background: var(--line);
    }
    .chip.on, .seg button.on, .kseg button.on {
      background: var(--black);
      color: var(--paper);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 0 32px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; gap: 0; }
    }
    .panel {
      background: transparent;
      border: 0;
      border-radius: var(--r);
      padding: 0;
      box-shadow: none;
    }
    .panel + .panel {
      border-left: 1px solid var(--line);
      padding-left: 32px;
    }
    @media (max-width: 900px) {
      .panel + .panel {
        border-left: 0;
        padding-left: 0;
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 20px;
      }
    }
    .panel h2 {
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }
    form { display: grid; gap: 12px; }
    .field, label.field {
      display: grid;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .field > span {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--r-field);
      padding: 8px 10px;
      font: 15px/1.3 var(--sans);
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--white);
    }
    input[type="number"]:focus,
    .seg button:focus-visible,
    .kseg button:focus-visible,
    .chip:focus-visible,
    button:focus-visible,
    .toggle input:focus-visible,
    details.formula summary:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .seg, .kseg { display: flex; flex-wrap: wrap; gap: 4px; }
    .kseg button { min-width: 42px; text-align: center; }
    .toggle {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-weight: 500;
      font-size: 13px;
      padding: 8px 10px;
      border: 0;
      border-left: 4px solid transparent;
      border-radius: var(--r);
      background: var(--wheat);
    }
    .toggle.on {
      border-left-color: var(--claret);
    }
    .toggle input { margin-top: 3px; accent-color: var(--claret); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .primary, .ghost {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: var(--r-field);
      padding: 8px 14px;
      font: 13px/1.2 var(--sans);
      font-weight: 500;
      cursor: pointer;
    }
    .primary { background: var(--claret); color: var(--white); }
    .primary:hover { background: var(--claret-50); }
    .primary:disabled { background: var(--mute); cursor: not-allowed; }
    .ghost { background: var(--wheat); color: var(--ink); }
    .ghost.ok { background: var(--jade); color: var(--white); }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      margin-bottom: 14px;
    }
    .card {
      background: var(--wheat);
      border: 0;
      border-radius: var(--r);
      padding: 10px 12px 8px;
      box-shadow: none;
    }
    .card .k {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .card .v {
      font-family: var(--serif);
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
      margin-top: 2px;
    }
    #days { color: var(--teal); }
    .card .s { font-size: 12px; color: var(--mute); }
    .meta {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--mute);
      margin: 0 0 14px;
    }
    .meta b { color: var(--ink); font-weight: 500; }
    .note {
      font-size: 13px;
      background: var(--wheat);
      border: 0;
      border-radius: var(--r);
      padding: 10px 12px;
      margin: 0 0 14px;
      color: var(--ink);
      box-shadow: none;
    }
    .err {
      background: var(--wheat);
      border: 0;
      border-left: 4px solid var(--crimson);
      border-radius: var(--r);
      color: var(--crimson);
      padding: 10px 12px;
      font-size: 13px;
      box-shadow: none;
    }
    .chart-wrap {
      margin: 4px 0 14px;
      border-radius: var(--r);
    }
    .chart-wrap figcaption {
      font-size: 12px;
      color: var(--mute);
      margin: 0 0 6px;
      font-weight: 400;
    }
    svg.spark { width: 100%; height: auto; display: block; border-radius: var(--r); }
    .sens {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin: 0 0 14px;
      font-variant-numeric: tabular-nums;
    }
    .sens th, .sens td {
      text-align: right;
      padding: 5px 6px;
      border-bottom: 1px solid var(--line);
    }
    .sens th:first-child, .sens td:first-child { text-align: left; }
    .sens th { color: var(--mute); font-weight: 500; }
    .sens tr.cur td { font-weight: 500; background: var(--wheat); }
    .peek {
      border-radius: var(--r);
      padding: 10px 0 12px;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      margin: 0 0 14px;
      box-shadow: none;
    }
    .peek.warn {
      background: var(--wheat);
      border-top: 0;
      border-left: 4px solid var(--claret);
      padding: 10px 12px;
    }
    .peek.warn h3 { color: var(--claret); }
    .peek h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; }
    .peek p { margin: 0 0 8px; font-size: 13px; color: var(--mute); }
    .peek p:last-child { margin-bottom: 0; }
    .peek b { color: var(--ink); font-weight: 500; }
    details.formula {
      font-size: 13px;
      color: var(--mute);
      margin: 0 0 8px;
    }
    details.formula summary { cursor: pointer; font-weight: 500; color: var(--ink); }
    details.formula pre {
      white-space: pre-wrap;
      background: var(--wheat);
      color: var(--ink);
      border-radius: var(--r);
      padding: 10px 12px;
      font: 12px/1.45 var(--sans);
      font-variant-numeric: tabular-nums;
      overflow: auto;
    }
    footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--mute);
      font-size: 12px;
    }
    footer a { color: var(--oxford); }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <header>
      <h1>lift</h1>
      <div class="presets" id="presets" aria-label="프리셋"></div>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="in-title">
        <h2 id="in-title">입력</h2>
        <form id="form" autocomplete="off">
          <label class="field">
            기존 전환율
            <input id="p1Pct" name="p1Pct" type="number" min="0.01" max="99.99" step="0.01" value="4" />
          </label>

          <div class="row">
            <label class="field">
              최소 감지 효과
              <input id="mdePct" name="mdePct" type="number" min="0.01" step="0.01" value="15" />
            </label>
            <div>
              <div class="field">
                <div class="seg" id="mdeType" data-name="mdeType" role="group" aria-label="상대 절대">
                  <button type="button" data-value="relative" class="on">상대 %</button>
                  <button type="button" data-value="absolute">절대 %p</button>
                </div>
              </div>
            </div>
          </div>

          <div class="field">
            <div class="seg" id="direction" data-name="direction" role="group" aria-label="상승 하락">
              <button type="button" data-value="up" class="on">상승</button>
              <button type="button" data-value="down">하락</button>
            </div>
          </div>

          <div class="row">
            <label class="field">
              하루 방문자
              <input id="dailyVisitors" name="dailyVisitors" type="number" min="0" step="1" value="800" />
            </label>
            <div class="field">
              <span>안 개수</span>
              <div class="kseg" id="variants" data-name="variants" role="group" aria-label="안 개수">
                <button type="button" data-value="2" class="on">2</button>
                <button type="button" data-value="3">3</button>
                <button type="button" data-value="4">4</button>
                <button type="button" data-value="5">5</button>
                <button type="button" data-value="6">6</button>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="field">
              <span>유의수준</span>
              <div class="seg" id="significance" data-name="significance" role="group" aria-label="유의수준">
                <button type="button" data-value="90">90%</button>
                <button type="button" data-value="95" class="on">95%</button>
                <button type="button" data-value="99">99%</button>
              </div>
            </div>
            <div class="field">
              <span>검정력</span>
              <div class="seg" id="power" data-name="power" role="group" aria-label="검정력">
                <button type="button" data-value="80" class="on">80%</button>
                <button type="button" data-value="90">90%</button>
              </div>
            </div>
          </div>

          <div class="field">
            <div class="seg" id="sided" data-name="sided" role="group" aria-label="양측 단측">
              <button type="button" data-value="two" class="on">양측</button>
              <button type="button" data-value="one">단측</button>
            </div>
          </div>

          <label class="toggle" id="peekWrap">
            <input type="checkbox" id="peeking" />
            <div>중간에 결과 보기</div>
          </label>

          <div class="actions">
            <button class="primary" type="submit" id="calc">계산</button>
            <button class="ghost" type="button" id="copy">요약 복사</button>
          </div>
        </form>
      </section>

      <section class="panel" id="results" aria-live="polite" aria-labelledby="out-title">
        <h2 id="out-title">결과</h2>
        <div id="error" class="err hidden"></div>
        <div id="ok">
          <div class="cards">
            <div class="card">
              <div class="k">안당 n</div>
              <div class="v" id="nArm">—</div>
              <div class="s" id="nArmSub"></div>
            </div>
            <div class="card">
              <div class="k">전체 n</div>
              <div class="v" id="nTot">—</div>
              <div class="s" id="nTotSub"></div>
            </div>
            <div class="card">
              <div class="k">일수</div>
              <div class="v" id="days">—</div>
              <div class="s" id="daysSub"></div>
            </div>
            <div class="card">
              <div class="k">예상 전환</div>
              <div class="v" id="conv">—</div>
              <div class="s" id="convSub"></div>
            </div>
          </div>

          <div class="meta" id="meta"></div>
          <div class="note hidden" id="bonf"></div>

          <figure class="chart-wrap">
            <figcaption>상대 % 대비 안당 n (5% → 40%)</figcaption>
            <svg class="spark" id="spark" viewBox="0 0 440 168" role="img" aria-label="상대 효과 대비 안당 n"></svg>
          </figure>

          <table class="sens" id="sens">
            <thead>
              <tr><th>상대 %</th><th>p2</th><th>안당 n</th><th>일</th></tr>
            </thead>
            <tbody></tbody>
          </table>

          <div class="peek hidden" id="peek">
            <p id="peekBody"></p>
          </div>

          <details class="formula">
            <summary>식</summary>
            <pre id="formula"></pre>
          </details>
        </div>
      </section>
    </div>

    <footer>
      MIT · <a href="https://promptprobe.github.io/lift/">promptprobe</a>
    </footer>
  </div>

  <script src="lift.js"></script>
  <script>
    (function () {
      var LS = 'lift.inputs.v1';
      var form = document.getElementById('form');
      var ns = typeof Lift !== 'undefined' ? Lift : null;
      if (!ns) return;

      var lastSummary = '';

      function $(id) { return document.getElementById(id); }

      function segValue(el) {
        var on = el.querySelector('button.on');
        return on ? on.getAttribute('data-value') : null;
      }

      function setSeg(el, value) {
        var buttons = el.querySelectorAll('button');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].classList.toggle('on', buttons[i].getAttribute('data-value') === String(value));
        }
      }

      function readState() {
        return ns.normalizeState({
          p1Pct: Number($('p1Pct').value),
          mdePct: Number($('mdePct').value),
          mdeType: segValue($('mdeType')),
          direction: segValue($('direction')),
          dailyVisitors: Number($('dailyVisitors').value),
          variants: Number(segValue($('variants'))),
          significance: Number(segValue($('significance'))),
          power: Number(segValue($('power'))),
          sided: segValue($('sided')),
          peeking: $('peeking').checked
        });
      }

      function writeState(state) {
        state = ns.normalizeState(state);
        $('p1Pct').value = state.p1Pct;
        $('mdePct').value = state.mdePct;
        setSeg($('mdeType'), state.mdeType);
        setSeg($('direction'), state.direction);
        $('dailyVisitors').value = state.dailyVisitors;
        setSeg($('variants'), state.variants);
        setSeg($('significance'), state.significance);
        setSeg($('power'), state.power);
        setSeg($('sided'), state.sided);
        $('peeking').checked = state.peeking;
        $('peekWrap').classList.toggle('on', state.peeking);
      }

      function fmt(n) {
        if (n == null || !Number.isFinite(n)) return '—';
        return Math.round(n).toLocaleString('ko-KR');
      }

      function pct(p, d) {
        d = d == null ? 2 : d;
        return (p * 100).toFixed(d) + '%';
      }

      function renderChart(points, currentRel) {
        var svg = $('spark');
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var NS = 'http://www.w3.org/2000/svg';
        function el(name, attrs) {
          var n = document.createElementNS(NS, name);
          for (var k in attrs) n.setAttribute(k, attrs[k]);
          return n;
        }
        svg.appendChild(el('rect', { x: 0, y: 0, width: 440, height: 168, fill: '#FFF1E5' }));
        if (!points.length) return;

        var L = 52, R = 14, T = 12, B = 30;
        var iw = 440 - L - R, ih = 168 - T - B;
        var minM = points[0].mde, maxM = points[points.length - 1].mde;
        var maxN = 0;
        for (var i = 0; i < points.length; i++) if (points[i].n > maxN) maxN = points[i].n;
        maxN = maxN * 1.05 || 1;
        function x(m) { return L + (m - minM) / (maxM - minM || 1) * iw; }
        function y(n) { return T + (1 - n / maxN) * ih; }

        var ticks = [0.25, 0.5, 0.75, 1];
        for (var t = 0; t < ticks.length; t++) {
          var yy = T + (1 - ticks[t]) * ih;
          svg.appendChild(el('line', {
            x1: L, x2: L + iw, y1: yy, y2: yy,
            stroke: '#D8CDC2', 'stroke-width': 1
          }));
          var lab = el('text', {
            x: L - 6, y: yy + 3, fill: '#66605C',
            'font-size': 10, 'text-anchor': 'end',
            'font-family': '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
            'font-variant': 'tabular-nums'
          });
          lab.textContent = Math.round(maxN * ticks[t]).toLocaleString('ko-KR');
          svg.appendChild(lab);
        }

        var d = '';
        for (var j = 0; j < points.length; j++) {
          d += (j ? ' L ' : 'M ') + x(points[j].mde).toFixed(1) + ' ' + y(points[j].n).toFixed(1);
        }
        var area = d + ' L ' + x(points[points.length - 1].mde).toFixed(1) + ' ' + (T + ih) +
          ' L ' + x(points[0].mde).toFixed(1) + ' ' + (T + ih) + ' Z';
        svg.appendChild(el('path', { d: area, fill: '#990F3D', 'fill-opacity': 0.12 }));
        svg.appendChild(el('path', { d: d, fill: 'none', stroke: '#000000', 'stroke-width': 2 }));

        var xs = [0.05, 0.15, 0.25, 0.40];
        for (var xi = 0; xi < xs.length; xi++) {
          if (xs[xi] < minM - 0.001 || xs[xi] > maxM + 0.001) continue;
          var tx = el('text', {
            x: x(xs[xi]), y: 160, fill: '#66605C',
            'font-size': 10, 'text-anchor': 'middle',
            'font-family': '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
            'font-variant': 'tabular-nums'
          });
          tx.textContent = Math.round(xs[xi] * 100) + '%';
          svg.appendChild(tx);
        }

        if (currentRel != null && currentRel >= minM && currentRel <= maxM) {
          var cx = x(currentRel);
          svg.appendChild(el('line', {
            x1: cx, x2: cx, y1: T, y2: T + ih,
            stroke: '#990F3D', 'stroke-width': 1, 'stroke-dasharray': '3 3'
          }));
          var nearest = points[0];
          var best = Infinity;
          for (var p = 0; p < points.length; p++) {
            var dist = Math.abs(points[p].mde - currentRel);
            if (dist < best) { best = dist; nearest = points[p]; }
          }
          svg.appendChild(el('circle', {
            cx: cx, cy: y(nearest.n), r: 5,
            fill: '#990F3D', stroke: '#000000', 'stroke-width': 1.5
          }));
        }
      }

      function renderSens(state, plan) {
        var body = $('sens').querySelector('tbody');
        body.innerHTML = '';
        var mdEs = [0.05, 0.10, 0.15, 0.20, 0.30, 0.40];
        var curRel = plan && plan.ok ? Math.abs(plan.relLift) : null;
        for (var i = 0; i < mdEs.length; i++) {
          var trial = Object.assign({}, ns.stateToPlanInput(state), {
            mde: mdEs[i],
            mdePct: mdEs[i] * 100,
            mdeType: 'relative',
            p2: undefined
          });
          var r = ns.planTest(trial);
          var tr = document.createElement('tr');
          if (curRel != null && Math.abs(curRel - mdEs[i]) < 0.02) tr.className = 'cur';
          var cells = r.ok
            ? [
              Math.round(mdEs[i] * 100) + '%',
              pct(r.p2, 2),
              r.nPerVariant.toLocaleString('ko-KR'),
              r.days == null ? '—' : String(r.days)
            ]
            : [Math.round(mdEs[i] * 100) + '%', '—', '—', '—'];
          for (var c = 0; c < cells.length; c++) {
            var td = document.createElement('td');
            td.textContent = cells[c];
            tr.appendChild(td);
          }
          body.appendChild(tr);
        }
      }

      function render(plan, state) {
        var err = $('error');
        var ok = $('ok');
        if (!plan.ok) {
          err.textContent = plan.error;
          err.classList.remove('hidden');
          ok.classList.add('hidden');
          lastSummary = plan.error;
          return;
        }
        err.classList.add('hidden');
        ok.classList.remove('hidden');

        $('nArm').textContent = fmt(plan.nPerVariant);
        $('nArmSub').textContent = 'zα ' + plan.zAlpha.toFixed(3) + ' · zβ ' + plan.zBeta.toFixed(3);
        $('nTot').textContent = fmt(plan.totalN);
        $('nTotSub').textContent = plan.variants + ' × ' + fmt(plan.nPerVariant);
        $('days').textContent = plan.days == null ? '—' : fmt(plan.days);
        var perArmTraffic = state.dailyVisitors > 0 ? Math.floor(state.dailyVisitors / plan.variants) : 0;
        $('daysSub').textContent = plan.days == null
          ? '—'
          : '안당 ' + perArmTraffic.toLocaleString('ko-KR') + '명/일';
        $('conv').textContent = fmt(plan.expectedControl);
        $('convSub').textContent = '기존 · 처리 ~' + fmt(plan.expectedTreatment);

        var rel = plan.relLift * 100;
        var absPp = plan.delta * 100;
        var side = plan.sided === 'one' ? '단측' : '양측';
        $('meta').innerHTML =
          '처리 <b>' + pct(plan.p2, 2) + '</b> · 기존 <b>' + pct(plan.p1, 2) + '</b> · ' +
          absPp.toFixed(2) + '%p · 상대 ' +
          (rel >= 0 ? '상승' : '하락') + ' <b>' + Math.abs(rel).toFixed(1) + '%</b> · ' +
          side + ' ' + Math.round((1 - plan.alpha) * 100) + '% · 검정력 ' +
          Math.round(plan.power * 100) + '%';

        $('bonf').classList.add('hidden');
        $('bonf').textContent = '';

        var curve = ns.mdeCurve(ns.stateToPlanInput(state), 0.05, 0.40, 16);
        renderChart(curve, Math.abs(plan.relLift));
        renderSens(state, plan);

        var peek = $('peek');
        if (plan.peeking.enabled) {
          peek.classList.remove('hidden');
          peek.classList.add('warn');
          $('peekBody').textContent = '중간에 보면 거짓양이 늘어납니다.';
        } else {
          peek.classList.add('hidden');
          peek.classList.remove('warn');
          $('peekBody').textContent = '';
        }

        $('formula').textContent =
          'n_per = ((z_α + z_β)² × (p1(1−p1) + p2(1−p2))) / |p2−p1|²\n' +
          'p1 = ' + plan.p1 + '   p2 = ' + plan.p2 + '\n' +
          'α = ' + plan.alpha + (plan.comparisons > 1 ? '   α_adj = α / ' + plan.comparisons + ' = ' + plan.alphaAdj : '') + '\n' +
          'sided = ' + plan.sided + '   z_α = ' + plan.zAlpha + '   z_β = ' + plan.zBeta + '\n' +
          'n_raw = ' + plan.nRaw.toFixed(3) + '   n_per = ceil(n_raw) = ' + plan.nPerVariant;

        lastSummary = ns.formatPlan(plan, { bonferroni: true });
      }

      function persist(state) {
        try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
        if (history.replaceState) {
          history.replaceState(null, '', '#' + ns.serializeHash(state));
        } else {
          location.hash = ns.serializeHash(state);
        }
      }

      function recalc() {
        var state = readState();
        persist(state);
        render(ns.planTest(ns.stateToPlanInput(state)), state);
      }

      var presetsEl = $('presets');
      ns.PRESETS.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = p.label;
        b.addEventListener('click', function () {
          var chips = presetsEl.querySelectorAll('.chip');
          for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on');
          b.classList.add('on');
          var cur = readState();
          writeState(Object.assign({}, cur, {
            p1Pct: p.p1Pct,
            mdePct: p.mdePct,
            mdeType: p.mdeType,
            dailyVisitors: p.dailyVisitors,
            variants: p.variants || cur.variants
          }));
          recalc();
        });
        presetsEl.appendChild(b);
      });

      document.querySelectorAll('.seg, .kseg').forEach(function (group) {
        group.addEventListener('click', function (ev) {
          var btn = ev.target.closest('button');
          if (!btn) return;
          setSeg(group, btn.getAttribute('data-value'));
          recalc();
        });
      });

      $('peeking').addEventListener('change', function () {
        $('peekWrap').classList.toggle('on', $('peeking').checked);
        recalc();
      });

      ['p1Pct', 'mdePct', 'dailyVisitors'].forEach(function (id) {
        $(id).addEventListener('input', recalc);
      });

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        recalc();
        $('results').scrollIntoView({ behavior: 'auto', block: 'start' });
      });

      $('copy').addEventListener('click', function () {
        var text = lastSummary;
        function ok() {
          $('copy').textContent = '복사됨';
          $('copy').classList.add('ok');
          setTimeout(function () {
            $('copy').textContent = '요약 복사';
            $('copy').classList.remove('ok');
          }, 1400);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok).catch(function () {
            window.prompt('요약 복사', text);
          });
        } else {
          window.prompt('요약 복사', text);
        }
      });

      var initial = ns.DEFAULTS;
      if (location.hash && location.hash.length > 1) {
        initial = ns.parseHash(location.hash);
      } else {
        try {
          var saved = localStorage.getItem(LS);
          if (saved) initial = ns.normalizeState(JSON.parse(saved));
        } catch (e) {}
      }
      writeState(initial);
      recalc();
    })();
  </script>
</body>
</html>
